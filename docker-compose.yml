version: '3.8'

services:
  # =========================================================================
  # 1. ORBIT React + Vite Frontend (Nginx Production Web Server)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orbit-frontend
    restart: unless-stopped
    ports:
      - "80:80" # Standard HTTP port on EC2
      - "3000:80" # Optional port 3000 mapping
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    networks:
      - orbit-net

  # =========================================================================
  # 2. Node.js Backend API (Grok AI, Firebase RTDB, Event Pipeline)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbit-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-https://rasptemp-d5695-default-rtdb.firebaseio.com}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-rasptemp-d5695}
      - GROK_API_KEY=${GROK_API_KEY}
      - GROK_MODEL=${GROK_MODEL:-grok-beta}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID:-orbit-backend}
    networks:
      - orbit-net

  # =========================================================================
  # 3. Zookeeper (Kafka Coordination)
  # =========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: orbit-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - orbit-net

  # =========================================================================
  # 4. Apache Kafka Broker
  # =========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: orbit-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - orbit-net

networks:
  orbit-net:
    name: orbit-network
    driver: bridge
